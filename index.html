<!doctype html>
<html lang="mr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>माझी स्तोत्रे</title>
<meta name="description" content="रामरक्षा व भीमरूपी स्तोत्र — मोठ्या अक्षरांत, इंटरनेटशिवाय, जाहिरातींविना.">
<meta name="theme-color" content="#FBF7EF" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="स्तोत्रे">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="fonts/NotoSerifDevanagari-Regular-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Icons: original drawings for this app on a 24-unit grid (CC0). Each <use> sits inside a labelled button. -->
<svg class="defs" aria-hidden="true" focusable="false">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11"/><circle cx="4.75" cy="6.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.75" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.75" cy="17.5" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-recite" viewBox="0 0 24 24"><path d="M3.5 6h10M3.5 11h10M3.5 16h7"/><path d="M19 4.5v14M15.75 15.25 19 18.5l3.25-3.25"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3.5 4.5 21 12 3.5 19.5 6.75 12z"/><path d="M6.75 12h6.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></symbol>
  <symbol id="i-go" viewBox="0 0 24 24"><path d="M9 4.5 16.5 12 9 19.5"/></symbol>
  <symbol id="i-mala" viewBox="0 0 24 24"><circle cx="12" cy="10.5" r="7" stroke-dasharray="0.01 3.66" stroke-width="2.8"/><path d="M12 17.5v3M10 21h4"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5.5 16.5V11a6.5 6.5 0 0 1 13 0v5.5l1.5 2h-16z"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6v.1"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C9.8 5 6.8 4.6 3.5 5v13.5c3.3-.4 6.3 0 8.5 1.5 2.2-1.5 5.2-1.9 8.5-1.5V5c-3.3-.4-6.3 0-8.5 1.5z"/><path d="M12 6.5V20"/></symbol>
  <symbol id="i-scroll" viewBox="0 0 24 24"><rect x="4" y="3" width="10.5" height="18" rx="1.5"/><path d="M7 8h4.5M7 12h4.5M7 16h3"/><path d="M19.5 6v12M17 15.5l2.5 2.5 2.5-2.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
</svg>

<div id="app">
  <main id="reader" class="reader" aria-label="वाचन">
    <div id="viewport" class="viewport">
      <div id="track" class="track">
        <section class="page" data-slot="prev" aria-hidden="true"></section>
        <section class="page" data-slot="cur" aria-live="polite"></section>
        <section class="page" data-slot="next" aria-hidden="true"></section>
      </div>
      <div class="zones" id="zones">
        <button type="button" class="zone" id="zPrev" aria-label="मागचे पान"></button>
        <button type="button" class="zone" id="zMid" aria-label="बटणे दाखवा किंवा लपवा" aria-expanded="false" aria-controls="rail"></button>
        <button type="button" class="zone" id="zNext" aria-label="पुढचे पान"></button>
      </div>
      <button type="button" class="cover-go" id="coverGo" hidden></button>
    </div>
    <div id="scroller" class="scroller" hidden></div>
    <div id="welcome" class="welcome" hidden>
      <p class="welcome-name">माझी स्तोत्रे</p>
    </div>
    <p id="pageno" class="folio" aria-hidden="true"></p>
  </main>

  <!-- the one reading bar: it rises into the bottom margin on a tap in the middle of the page -->
  <nav class="rail" id="rail" aria-label="वाचनाची बटणे">
    <button type="button" class="rail-loc" id="libBtn" aria-haspopup="dialog" aria-controls="library" aria-labelledby="locName locPos locSr">
      <svg class="ico" aria-hidden="true"><use href="#i-list"/></svg>
      <span class="loc"><span class="loc-name" id="locName"></span><span class="loc-pos" id="locPos"></span></span>
      <span class="sr" id="locSr">— यादी उघडा</span>
    </button>
    <button type="button" class="act" id="lookBtn" aria-haspopup="dialog" aria-controls="look" aria-label="अक्षरे">
      <span class="g-aa" aria-hidden="true"><span>अ</span>अ</span>
    </button>
    <button type="button" class="act" id="countBtn">
      <span class="cnt" id="countLbl">०/११</span>
    </button>
    <button type="button" class="act" id="reciteBtn" aria-label="पारायण">
      <svg class="ico" aria-hidden="true"><use href="#i-recite"/></svg>
    </button>
    <button type="button" class="act" id="shareBtn" aria-label="पाठवा">
      <svg class="ico" aria-hidden="true"><use href="#i-send"/></svg>
    </button>
  </nav>

  <div class="rail recitebar" id="recitebar" hidden>
    <button type="button" class="act" id="playBtn" aria-pressed="false" aria-label="सुरू करा">
      <svg class="ico ico-play" aria-hidden="true"><use href="#i-play"/></svg>
      <svg class="ico ico-pause" aria-hidden="true"><use href="#i-pause"/></svg>
    </button>
    <div class="speed" role="group" aria-label="वेग">
      <button type="button" class="stepbtn" id="slowBtn" aria-label="वेग कमी">−</button>
      <span class="speedval" id="speedLbl">४</span>
      <button type="button" class="stepbtn" id="fastBtn" aria-label="वेग जास्त">+</button>
    </div>
    <button type="button" class="act" id="countBtn2"><span class="cnt" id="countLbl2">०/११</span></button>
    <button type="button" class="act" id="reciteClose" aria-label="बंद">
      <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
</div>


<!-- contents page: every text, then the three quiet links -->
<section class="view" id="library" role="dialog" aria-modal="true" aria-labelledby="libTitle" hidden>
  <div class="view-body">
    <h1 class="view-title" id="libTitle" tabindex="-1">माझी स्तोत्रे</h1>
    <div id="shelf"></div>
    <ul class="links">
      <li><button type="button" class="link" data-open="japa"><svg class="ico" aria-hidden="true"><use href="#i-mala"/></svg><span>जप</span><svg class="ico go" aria-hidden="true"><use href="#i-go"/></svg></button></li>
      <li><button type="button" class="link" data-open="remind"><svg class="ico" aria-hidden="true"><use href="#i-bell"/></svg><span>आठवण</span><svg class="ico go" aria-hidden="true"><use href="#i-go"/></svg></button></li>
      <li><button type="button" class="link" data-open="about"><svg class="ico" aria-hidden="true"><use href="#i-info"/></svg><span>माहिती व श्रेय</span><svg class="ico go" aria-hidden="true"><use href="#i-go"/></svg></button></li>
    </ul>
  </div>
  <div class="view-foot">
    <button type="button" class="backbtn" id="libBack"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg><span class="sr">परत: </span><span id="libBackName"></span></button>
  </div>
</section>

<section class="view sub" id="japa" role="dialog" aria-modal="true" aria-labelledby="japaTitle" hidden>
  <div class="view-body">
    <h2 class="view-title" id="japaTitle" tabindex="-1">जप</h2>
    <section class="sec">
      <h3 id="targetH">संकल्प</h3>
      <div class="stepper">
        <button type="button" class="stepbtn" id="targetDown" aria-label="संकल्प कमी करा">−</button>
        <output class="bigval" id="targetVal" aria-labelledby="targetH">११</output>
        <button type="button" class="stepbtn" id="targetUp" aria-label="संकल्प वाढवा">+</button>
      </div>
      <div class="chips" role="group" aria-label="लगेच निवडा">
        <button type="button" class="chip" data-target="1">१</button>
        <button type="button" class="chip" data-target="11">११</button>
        <button type="button" class="chip" data-target="21">२१</button>
        <button type="button" class="chip" data-target="108">१०८</button>
      </div>
    </section>
    <section class="sec" id="countSec">
      <button type="button" class="wide" id="countReset">या स्तोत्राची मोजणी शून्य करा</button>
    </section>
  </div>
  <div class="view-foot"><button type="button" class="backbtn" data-back><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg><span class="sr">परत: माझी स्तोत्रे</span></button></div>
</section>

<section class="view sub" id="remind" role="dialog" aria-modal="true" aria-labelledby="remindTitle" hidden>
  <div class="view-body">
    <h2 class="view-title" id="remindTitle" tabindex="-1">आठवण</h2>
    <div class="remind">
      <p class="rtitle">रामरक्षा — रोज संध्याकाळी ७ वाजता</p>
      <div class="rbtns">
        <a class="wide" id="gcalRR" target="_blank" rel="noopener">Google Calendar</a>
        <a class="wide alt" href="reminders/ramraksha-daily-1900.ics" target="_blank" rel="noopener">iPhone / इतर</a>
      </div>
    </div>
    <div class="remind">
      <p class="rtitle">भीमरूपी — दर शनिवारी सकाळी ७ वाजता</p>
      <div class="rbtns">
        <a class="wide" id="gcalBH" target="_blank" rel="noopener">Google Calendar</a>
        <a class="wide alt" href="reminders/bhimrupi-saturday-0700.ics" target="_blank" rel="noopener">iPhone / इतर</a>
      </div>
    </div>
  </div>
  <div class="view-foot"><button type="button" class="backbtn" data-back><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg><span class="sr">परत: माझी स्तोत्रे</span></button></div>
</section>

<section class="view sub" id="about" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
  <div class="view-body">
    <h2 class="view-title" id="aboutTitle" tabindex="-1">माहिती व श्रेय</h2>
    <div id="credits" class="credits"></div>
  </div>
  <div class="view-foot"><button type="button" class="backbtn" data-back><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg><span class="sr">परत: माझी स्तोत्रे</span></button></div>
</section>

<!-- letters and colour: a short sheet, so the page above it shows each change at once -->
<div class="sheet" id="look" role="dialog" aria-modal="true" aria-labelledby="lookTitle" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="lookTitle" class="sr" tabindex="-1">अक्षरे व रंग</h2>
      <button type="button" class="iconbtn" id="lookClose" aria-label="बंद करा"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sizerow">
      <button type="button" class="stepbtn g-small" id="sizeDown" aria-label="अक्षरे लहान करा">अ</button>
      <input type="range" id="sizeRange" min="20" max="56" step="1" value="34" aria-label="अक्षरांचा आकार" aria-valuetext="३४">
      <button type="button" class="stepbtn g-large" id="sizeUp" aria-label="अक्षरे मोठी करा">अ</button>
    </div>
    <div class="swatches" role="group" aria-label="रंग">
      <button type="button" class="swatch sw-paper" data-theme-choice="paper" aria-pressed="false" aria-label="कागद"><span class="chip-a" aria-hidden="true">अ<svg class="ico tick"><use href="#i-check"/></svg></span></button>
      <button type="button" class="swatch sw-sepia" data-theme-choice="sepia" aria-pressed="false" aria-label="पोथी"><span class="chip-a" aria-hidden="true">अ<svg class="ico tick"><use href="#i-check"/></svg></span></button>
      <button type="button" class="swatch sw-night" data-theme-choice="night" aria-pressed="false" aria-label="रात्र"><span class="chip-a" aria-hidden="true">अ<svg class="ico tick"><use href="#i-check"/></svg></span></button>
    </div>
    <div class="modes" role="group" aria-label="कसे वाचायचे">
      <button type="button" class="mode" data-mode-choice="page" aria-pressed="true" aria-label="पान उलटून"><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg></button>
      <button type="button" class="mode" data-mode-choice="scroll" aria-pressed="false" aria-label="खाली सरकवून"><svg class="ico" aria-hidden="true"><use href="#i-scroll"/></svg></button>
    </div>
    <div id="meaningSec">
      <label class="switch"><input type="checkbox" id="meaningToggle"><span class="track-s" aria-hidden="true"></span><span class="lbl">मराठी अर्थ</span></label>
    </div>
    <label class="switch"><input type="checkbox" id="motionToggle"><span class="track-s" aria-hidden="true"></span><span class="lbl">पान उलटताना हलकी हालचाल</span></label>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="measure" id="measure" aria-hidden="true"></div>
<noscript><p class="noscript">‘माझी स्तोत्रे’ चालण्यासाठी JavaScript सुरू असणे आवश्यक आहे.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
